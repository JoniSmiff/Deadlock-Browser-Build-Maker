<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlock Build Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6eceb; --panel:#f6f9f8; --raise:#ffffff; --ink:#152226; --muted:#55696b; --line:#c3d0cf;
  --brass:#8a6410; --brass-ink:#ffffff; --weapon:#b3600c; --vitality:#4d7f12; --spirit:#7a45c4; --danger:#b23a24;
  --focus:#1f6f8b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#152023; --panel:#1c2a2e; --raise:#25363b; --ink:#ece5d3; --muted:#9bb0ad; --line:#34494e;
    --brass:#d6ad52; --brass-ink:#1a1405; --weapon:#e7953f; --vitality:#8cc63f; --spirit:#bd92f2; --danger:#ee7a62;
    --focus:#7cc7e0;
  }
}
:root[data-theme="dark"]{
  --bg:#152023; --panel:#1c2a2e; --raise:#25363b; --ink:#ece5d3; --muted:#9bb0ad; --line:#34494e;
  --brass:#d6ad52; --brass-ink:#1a1405; --weapon:#e7953f; --vitality:#8cc63f; --spirit:#bd92f2; --danger:#ee7a62;
  --focus:#7cc7e0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.05rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:.5rem .8rem;min-height:40px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:600}
button.quiet{background:transparent}
button.icon{padding:0;width:38px;min-height:38px;display:inline-grid;place-items:center;line-height:1}
button.danger{color:var(--danger)}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;min-height:40px}
textarea{resize:vertical;min-height:64px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.2rem}
.wrap{max-width:1180px;margin:0 auto;padding:1rem 1rem 7.5rem}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
#sync{font-size:.85rem;color:var(--muted)}
.builds{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:1rem;align-items:stretch}
.builds button{white-space:nowrap;flex:none}
.builds .tab{text-align:left;max-width:15rem;overflow:hidden;text-overflow:ellipsis}
.builds .tab small{display:block;color:var(--muted);font-size:.75rem}
.builds .tab[aria-current="true"]{border-color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.cols{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem;margin-bottom:1rem}
.grid2{display:grid;gap:.75rem;grid-template-columns:1fr}
.row{display:flex;gap:.5rem;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem;margin:.3rem 0 0}
.warn{color:var(--danger);font-size:.9rem;margin:.4rem 0 0}
.cat{border:1px solid var(--line);border-radius:8px;padding:.7rem;margin-top:.7rem;background:var(--bg)}
.cat.active{border:2px dashed var(--brass);padding:calc(.7rem - 1px)}
.cat-head{display:flex;gap:.4rem;align-items:center}
.cat-head input{font-weight:600}
label.check{display:flex;align-items:center;gap:.45rem;color:var(--ink);font-size:.95rem;margin:.6rem 0 0;cursor:pointer}
label.check input{width:20px;height:20px;accent-color:var(--brass)}
.cat-meta{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.cat-meta input[type=text]{font-size:.9rem;min-height:36px}
.cat-meta .opt{display:flex;align-items:center;gap:.35rem;margin:0;color:var(--ink);font-size:.92rem;white-space:nowrap;cursor:pointer}
.cat-meta .opt input{width:20px;height:20px;accent-color:var(--brass)}
.items{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.35rem}
.item{background:var(--raise);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:.3rem .3rem .3rem .6rem}
.item .line{display:flex;align-items:center;gap:.3rem}
.item .nm{flex:1;min-width:0;overflow-wrap:break-word;line-height:1.25;padding:.15rem 0}
.item .tier{display:block;font-size:.75rem;color:var(--muted)}
.item button.icon{width:34px;min-height:34px;border-color:transparent}
.item.off{opacity:.55}
.item .off-note{font-size:.78rem;color:var(--danger);margin:.1rem 0 .2rem}
.item input.note{margin:.3rem 0 .2rem;font-size:.9rem}
.item .imbue{display:grid;grid-template-columns:auto 1fr;gap:.2rem .5rem;align-items:center;margin:.3rem 0 .2rem}
.item .imbue label{margin:0}
.item .imbue select{min-height:36px;font-size:.9rem}
.item .imbue .off-note{grid-column:1/-1}
.w{--c:var(--weapon)} .v{--c:var(--vitality)} .s{--c:var(--spirit)} .u{--c:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tags select{width:auto;flex:1 1 9rem;max-width:16rem}
.chip{display:inline-flex;align-items:center;gap:.1rem;background:var(--raise);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:0 0 0 .55rem;font-size:.92rem}
.chip button.icon{width:32px;min-height:32px;border-color:transparent}
.empty{color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
.abil-btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
.abil-btns button{text-align:left}
.abil-btns .pips{display:block;font-size:.78rem;color:var(--muted)}
ol.steps{margin:.7rem 0 0;padding-left:1.6rem;display:grid;gap:.15rem;font-size:.92rem}
/* shop */
#shop{background:var(--panel)}
.shop-head{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.filters{display:flex;gap:.35rem;flex-wrap:wrap;margin:.6rem 0}
.filters button{min-height:34px;padding:.25rem .65rem;border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shop-list h3{margin:.9rem 0 .35rem;color:var(--c)}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.35rem}
.shop-grid button{text-align:left;border-left:5px solid var(--c);min-height:42px;padding:.35rem .5rem;font-size:.92rem;position:relative}
.shop-grid button.off{opacity:.5}
.shop-grid button .n{position:absolute;top:2px;right:6px;font-size:.72rem;color:var(--muted)}
.shop-grid button.flash{background:var(--brass);color:var(--brass-ink)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.bar-in .primary{flex:1 1 12rem;min-height:48px;font-size:1.05rem}
#status{flex:1 1 100%;font-size:.85rem;color:var(--muted);min-height:1.2em}
#codebox{flex:1 1 100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;min-height:70px;word-break:break-all}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:1rem;width:min(34rem,calc(100vw - 2rem))}
dialog::backdrop{background:rgba(0,0,0,.55)}
button.danger.solid{background:var(--danger);color:var(--panel);border-color:var(--danger);font-weight:600}
#askMsg{margin:0;overflow-wrap:anywhere}
[hidden]{display:none!important}
@media (max-width:899px){
  #shop{position:fixed;inset:0;z-index:10;margin:0;border:0;border-radius:0;overflow:auto;
    padding:calc(.9rem + env(safe-area-inset-top,0px)) .9rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
  #shop:not(.open){display:none}
  .shop-head{position:sticky;top:calc(-.9rem - env(safe-area-inset-top,0px));background:var(--panel);
    padding:calc(.6rem + env(safe-area-inset-top,0px)) 0 .5rem;z-index:1;margin-top:-.6rem}
}
@media (min-width:900px){
  .grid2{grid-template-columns:14rem 1fr}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
  #shop{position:sticky;top:1rem;max-height:calc(100vh - 8rem);overflow:auto}
  #shopClose,.add-items{display:none}
}
@media (prefers-reduced-motion:no-preference){.shop-grid button{transition:background-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Deadlock Build Maker</h1>
    <span id="sync" role="status"></span>
  </header>

  <nav class="builds" id="builds" aria-label="Your builds"></nav>

  <div class="cols">
    <main id="editor">
      <section class="panel">
        <div class="grid2">
          <div><label for="hero">Hero</label><select id="hero"></select></div>
          <div><label for="bname">Build name</label><input type="text" id="bname" maxlength="120" autocomplete="off"></div>
        </div>
        <div style="margin-top:.75rem"><label for="bdesc">Build description (optional)</label><textarea id="bdesc" maxlength="2000"></textarea></div>
        <div style="margin-top:.75rem"><label>Build tags (optional, up to 3)</label><div id="tags" class="tags"></div></div>
        <div class="row end" style="margin-top:.6rem"><button class="quiet danger" id="delBuild">Delete this build</button></div>
      </section>

      <section class="panel" aria-labelledby="catsH">
        <div class="spread"><h2 id="catsH">Categories</h2><button id="addCat">Add category</button></div>
        <p class="hint" id="catHint"></p>
        <label class="check"><input type="checkbox" id="autoW"> Size each category to fit its items</label>
        <div id="cats"></div>
      </section>

      <section class="panel" aria-labelledby="abH">
        <div class="spread"><h2 id="abH">Ability point order</h2>
          <span class="row"><button id="abUndo">Undo last step</button><button id="abClear" class="quiet">Clear</button></span></div>
        <div id="abil"></div>
      </section>
    </main>

    <aside class="panel" id="shop" aria-labelledby="shopH">
      <div class="shop-head"><h2 id="shopH">Items</h2><button id="shopClose" class="primary">Done</button></div>
      <p class="hint" id="shopTarget" style="margin:0 0 .5rem"></p>
      <input type="search" id="q" placeholder="Search items" autocomplete="off" aria-label="Search items">
      <div class="filters" id="filters"></div>
      <div class="shop-list" id="shopList"></div>
    </aside>
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <button class="primary" id="copy">Copy build code</button>
    <button id="toggleCode">Show code</button>
    <span id="status" role="status" aria-live="polite"></span>
    <textarea id="codebox" readonly hidden aria-label="Build code"></textarea>
  </div>
</div>

<dialog id="loadDlg" aria-labelledby="loadH">
  <h2 id="loadH">Load a build code</h2>
  <p class="hint">Copy a build in Deadlock, then paste the code here. It opens as a new build you can edit or move to another hero.</p>
  <textarea id="loadText" style="margin-top:.6rem;min-height:120px" aria-label="Build code to load"></textarea>
  <label class="check"><input type="checkbox" id="loadStrip"> Remove "Copy of" from the build name</label>
  <p class="warn" id="loadErr" hidden></p>
  <div class="row end" style="margin-top:.7rem"><button id="loadCancel" class="quiet">Cancel</button><button id="loadGo" class="primary">Load code</button></div>
</dialog>

<dialog id="askDlg" aria-labelledby="askMsg">
  <p id="askMsg"></p>
  <div class="row end" style="margin-top:.9rem"><button id="askNo" class="quiet">Cancel</button><button id="askYes" class="danger solid">Delete</button></div>
</dialog>

        var off = blocked(it);
        var btn = h('button', { class: off ? 'off' : '', title: off ? 'Can\'t be bought on ' + heroName(b.heroId) : null, onclick: function () {
          var c = cur().cats[activeCat];
          if (!c) { say('Add a category first.'); return; }
          c.items.push({ id: it.id, note: '', nf: false, imbue: 0 }); touch(); renderCats();
          used[it.id] = (used[it.id] || 0) + 1; cnt.textContent = '×' + used[it.id];
          btn.classList.add('flash'); setTimeout(function () { btn.classList.remove('flash'); }, 180);
        } }, [it.n]);
        var cnt = h('span', { class: 'n', text: used[it.id] ? '×' + used[it.id] : '' });
        btn.appendChild(cnt); grid.appendChild(btn);
      });
      box.appendChild(h('div', { class: s }, [h('h3', { text: SLOT[s] + ', ' + tierLabel(k.slice(1)) }), grid]));
    });
  }
  function openShop() { $('shop').classList.add('open'); renderShop(); $('shop').scrollTop = 0; }
  function renderAll() { renderTabs(); renderMeta(); renderTags(); renderCats(); renderAbil(); renderShop(); if (!$('codebox').hidden) refreshCode(); say(''); }

  /* ---------- code out / in ---------- */
  /* One-row width measured from game codes: 2 items 175.5, 3 257.25, 4 339, 5 420.75 */
  /* Widest category the editor allows is 1083, which holds 13 items in a row.
     A 6-item, 2-per-row (3 row) category measured 402.75 tall; one row is 178.5. */
  var PER_ROW = 13, ROW_H = 112.125;
  function fitWidth(n) { return 12 + 81.75 * Math.min(Math.max(n, 1), PER_ROW); }
  function fitHeight(n, h) { var rows = Math.ceil(n / PER_ROW); return rows > 1 ? 178.5 + ROW_H * (rows - 1) : h; }
  function makeCode() {
    var b = cur();
    return Codec.encode({ buildId: 1, heroId: b.heroId, name: b.name || 'Untitled build', desc: b.desc,
      cats: b.cats.map(function (c) { return { name: c.name || 'Category', desc: c.desc, w: b.auto ? fitWidth(c.items.length) : c.w, h: b.auto ? fitHeight(c.items.length, c.h) : c.h, opt: c.opt, items: c.items }; }), abil: b.abil, tags: b.tags });
  }
  function refreshCode() { try { $('codebox').value = makeCode(); } catch (e) { $('codebox').value = ''; say(e.message); } }
  function copyCode() {
    var code; try { code = makeCode(); } catch (e) { say(e.message); return; }
    var done = function () { say('Copied. In Deadlock, open a build in the editor and press the paste button.'); };
    var fallback = function () {
      var box = $('codebox'); box.hidden = false; $('toggleCode').textContent = 'Hide code'; box.value = code; box.focus(); box.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) done(); else say('Copying is blocked here. The code is selected below, so copy it by hand.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback); else fallback();
  }
  /* The game names a copied build "Copy of <name>", once per copy. */
  function dropCopyOf(name) { return name.replace(/^\s*(?:copy of\s+)+/i, '') || name; }
  function loadCode() {
    var err = $('loadErr'), txt = $('loadText').value.trim();
    try {
      if (!txt) throw new Error('Paste a build code first.');
      var d = Codec.decode(txt, function (raw) { return fzstd.decompress(raw); });
      if (!d.heroId) throw new Error('That code has no hero in it, so it is probably not a build code.');
      var nb = clean(d, uid());
      if (stripCopy) nb.name = dropCopyOf(nb.name);
      nb.cats.forEach(function (c) { c.name = friendlyCat(c.name); });
      nb.updatedAt = 0;
      builds[nb.id] = nb; order.push(nb.id); curId = nb.id; activeCat = 0;
      $('loadDlg').close(); renderAll(); touch(); renderTabs();
      say('Loaded "' + nb.name + '" as a new build.');
    } catch (e) {
      err.textContent = /build code|Paste/.test(e.message) ? e.message : 'That code could not be read. Check that the whole code was pasted.';
      err.hidden = false;
    }
  }

  /* ---------- wire up ---------- */
  $('hero').addEventListener('change', function () { cur().heroId = Number(this.value); touch(); renderTabs(); renderCats(); renderAbil(); renderShop(); });
  $('bname').addEventListener('input', function () { cur().name = this.value; touch(); });
  $('bname').addEventListener('change', renderTabs);
  $('bdesc').addEventListener('input', function () { cur().desc = this.value; touch(); });
  $('delBuild').addEventListener('click', function () {
    var id = curId;
    ask('Delete "' + (cur().name || 'Untitled build') + '"? This cannot be undone.', function () { if (!builds[id]) return; removeBuild(id); renderAll(); });
  });
  $('addCat').addEventListener('click', function () {
    var b = cur(); b.cats.push({ name: 'Category ' + (b.cats.length + 1), desc: '', w: 600, h: 0, opt: false, items: [] }); activeCat = b.cats.length - 1; touch(); renderCats(); renderShop();
    var inputs = $('cats').querySelectorAll('.cat-head input'); var last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
  });
  $('autoW').addEventListener('change', function () { cur().auto = this.checked; touch(); });
  $('abUndo').addEventListener('click', function () { cur().abil.pop(); touch(); renderAbil(); });
  $('abClear').addEventListener('click', function () { cur().abil = []; touch(); renderAbil(); });
  $('q').addEventListener('input', renderShop);
  $('shopClose').addEventListener('click', function () { $('shop').classList.remove('open'); });
  $('copy').addEventListener('click', copyCode);
  $('toggleCode').addEventListener('click', function () {
    var box = $('codebox'); box.hidden = !box.hidden; this.textContent = box.hidden ? 'Show code' : 'Hide code'; if (!box.hidden) refreshCode();
  });
  $('loadCancel').addEventListener('click', function () { $('loadDlg').close(); });
  $('loadGo').addEventListener('click', loadCode);
  $('loadStrip').addEventListener('change', function () { stripCopy = this.checked; saveLocal(); });
  $('askNo').addEventListener('click', function () { askFn = null; $('askDlg').close(); });
  $('askYes').addEventListener('click', function () { var fn = askFn; askFn = null; $('askDlg').close(); if (fn) fn(); });

  loadLocal();
  $('loadStrip').checked = stripCopy;
  if (!curId) { if (order.length) curId = order[0]; else { var nb = newBuild(); builds[nb.id] = nb; order.push(nb.id); curId = nb.id; } }
  renderAll();
  initSync();
  window.__dlbm = { makeCode: makeCode, builds: builds, cur: cur };
})();

</script>
</body>
</html>
